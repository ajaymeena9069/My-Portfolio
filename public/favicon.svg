<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vivid Cyan Gradient Background (Forms the border) -->
  <rect width="256" height="256" rx="64" fill="url(#cyanGradient)"/>
  
  <!-- Deep Dark Blue Core -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#081b29"/>
  
  <!-- Bold, Crisp 'A' -->
  <text x="128" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="170" fill="url(#cyanGradient)" text-anchor="middle" letter-spacing="-2">A</text>
  
  <defs>
    <linearGradient id="cyanGradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00abf0"/>
    </linearGradient>
  </defs>
</svg>
